name: CI

on:
  push:
    branches: [main, bootstrap/rpg-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexus_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: PostgreSQL schema and regression tests
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/001_core.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/002_combat_content.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/003_progression_social.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/004_items_codex_seasons.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/content_minimums.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/system_minimums.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/realm_persistence.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/double_tap.sql

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm build

      - name: Critical dependency audit
        run: pnpm audit --audit-level critical
