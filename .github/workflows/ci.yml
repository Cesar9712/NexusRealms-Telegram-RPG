name: CI

on:
  push:
    branches: [main, bootstrap/rpg-platform, audit/aaa-hardening-20260908]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexus_test
      MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nexus_migrate_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build migration runner
        run: pnpm --filter @nexusrealms/api build
      - name: PostgreSQL full schema and regression tests
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter @nexusrealms/api migrate
          for test in database/tests/*.sql; do
            echo "Running $test"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test"
          done
      - name: Production migration runner idempotency smoke test
        run: |
          psql "postgres://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "create database nexus_migrate_test"
          DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" pnpm --filter @nexusrealms/api migrate
          DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" pnpm --filter @nexusrealms/api migrate
          for test in database/tests/*.sql; do
            echo "Running $test against migration-smoke DB"
            psql "$MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test"
          done
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm build
      - name: Critical dependency audit
        run: pnpm audit --audit-level critical
